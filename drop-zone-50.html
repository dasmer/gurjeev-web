<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Drop Zone 50</title>
  <style>
    *{box-sizing:border-box} body{margin:0;background:#05060c;min-height:100vh;display:grid;place-items:center;font-family:Inter,ui-sans-serif,system-ui,sans-serif;color:#f7f9ff;overflow:hidden}
    #cabinet{width:min(100vw,620px);height:min(100vh,820px);min-height:570px;position:relative;overflow:hidden;background:radial-gradient(circle at 50% 18%,#23376c 0,#101a38 40%,#080b18 76%);border:1px solid #7d9dff80;border-radius:28px;box-shadow:0 0 0 1px #a7c4ff22,0 22px 70px #000,0 0 70px #315dff25;isolation:isolate}
    #cabinet:before{content:"";position:absolute;inset:0;pointer-events:none;background:linear-gradient(115deg,#fff0 25%,#c9dcff0 40%,#c9dcff18 50%,#fff0 60%);z-index:4}
    #marquee{height:122px;display:grid;place-items:center;text-align:center;letter-spacing:2px;background:linear-gradient(115deg,#161b42,#304eae 47%,#25377d);border-bottom:1px solid #a6c4ff77;box-shadow:inset 0 -20px 32px #03051055}
    #marquee small{display:block;font:700 11px system-ui;letter-spacing:4px;color:#a9c8ff;margin-bottom:8px}.logo{font:800 44px Inter,ui-sans-serif,sans-serif;letter-spacing:-2px;color:#f6f8ff;text-shadow:0 3px 15px #9eb6ff88}.logo b{color:#70e2ff}
    #hud{height:76px;display:flex;justify-content:space-around;align-items:center;background:#0a1025d9;border-bottom:1px solid #7b9cff55;font:700 11px system-ui;letter-spacing:1px;text-align:center}.readout{min-width:125px;color:#92a8d8}.readout strong{display:block;color:#fff;font:800 30px Inter,ui-sans-serif,sans-serif;letter-spacing:-1px;line-height:32px}.readout:first-child strong{color:#ff7983}
    #stage{position:absolute;left:27px;right:27px;top:205px;bottom:114px;border:1px solid #91b5ff99;border-radius:20px;background:radial-gradient(ellipse at 50% 8%,#466cc5,#121c42 48%,#070b1c);box-shadow:inset 0 0 0 1px #d7e6ff28,inset 0 0 60px #000;overflow:hidden}canvas{width:100%;height:100%;display:block}
    #control{position:absolute;inset:auto 0 0;height:108px;display:grid;place-items:center;background:#0b1022;border-top:1px solid #7b9fff66}#drop{width:204px;height:64px;border:1px solid #ffabb1;background:linear-gradient(135deg,#ff6672,#e51d40);border-radius:18px;color:#fff;font:800 18px Inter,ui-sans-serif,sans-serif;letter-spacing:1px;box-shadow:0 9px 22px #e900303d,inset 0 1px #fff8;cursor:pointer;touch-action:manipulation}#drop:active,#drop.pressed{transform:scale(.96);box-shadow:0 3px 10px #e900303d}#instructions{position:absolute;bottom:8px;font:600 10px system-ui;letter-spacing:1px;color:#93a8d8}
    #overlay{position:absolute;inset:0;z-index:10;display:grid;place-items:center;background:#060918cc;backdrop-filter:blur(9px);text-align:center;padding:30px}.panel{max-width:420px;padding:30px 26px;border:1px solid #a8c8ff88;border-radius:24px;background:linear-gradient(145deg,#263b78e8,#101933e8);box-shadow:0 18px 55px #000}.panel h1{margin:0 0 11px;color:#fff;font:800 36px Inter,ui-sans-serif,sans-serif;letter-spacing:-2px}.panel p{font:500 16px system-ui;line-height:1.5;color:#dce6ff;margin:0 0 22px}.panel button{border:0;border-radius:13px;padding:13px 28px;background:#72ddfa;color:#071325;font:800 15px system-ui;cursor:pointer;box-shadow:0 5px 18px #5edbff55}
    @media(max-width:500px){#cabinet{height:100vh;border-radius:0;border-width:4px}.logo{font-size:42px}#stage{left:12px;right:12px}.readout{min-width:85px}.readout strong{font-size:27px}}
  </style>
</head>
<body><main id="cabinet"><div id="marquee"><div><small>ARCADE SKILL CHALLENGE</small><div class="logo">DROP <b>ZONE</b> 50</div></div></div><div id="hud"><div class="readout">TIME<strong id="time">45</strong></div><div class="readout">CAUGHT<strong><span id="caught">0</span> / 50</strong></div><div class="readout">BALLS LEFT<strong id="left">50</strong></div></div><div id="stage"><canvas id="game"></canvas></div><div id="control"><button id="drop">DROP BALL</button><div id="instructions">TIME THE DROP • CLICK OR PRESS SPACE</div></div><div id="overlay"><section class="panel" id="panel"><h1>DROP ZONE 50</h1><p>Like the arcade challenge: time each drop so a moving cup passes under the chute. Catch all 50 red balls in 45 seconds.</p><button id="start">START GAME</button></section></div></main>
<script>
(()=>{const c=document.querySelector('#game'),x=c.getContext('2d'),stage=document.querySelector('#stage'),dropBtn=document.querySelector('#drop'),timeEl=document.querySelector('#time'),caughtEl=document.querySelector('#caught'),leftEl=document.querySelector('#left'),overlay=document.querySelector('#overlay'),panel=document.querySelector('#panel');let W,H,run=false,startAt=0,last=0,angle=0,balls=[],caught=0,dropped=0,nextDrop=0,raf,audio;
const cups=Array.from({length:9},(_,i)=>({slot:i,fill:0}));
function resize(){let r=stage.getBoundingClientRect(),d=devicePixelRatio;c.width=r.width*d;c.height=r.height*d;x.setTransform(d,0,0,d,0,0);W=r.width;H=r.height}addEventListener('resize',resize);resize();
function cupPos(cup){let spacing=Math.min(82,W*.15),track=W+spacing*2,travel=(angle*115+cup.slot*spacing)%track;return{x:travel-spacing,y:H*.62,depth:0}}
function drawCup(p,cup){let s=.78+p.depth*.18;x.save();x.translate(p.x,p.y);x.scale(s,s);x.fillStyle='#091631';x.beginPath();x.ellipse(0,-20,29,10,0,0,Math.PI*2);x.fill();x.strokeStyle='#8be8ff';x.lineWidth=4;x.stroke();x.fillStyle='#36a8d5';x.beginPath();x.moveTo(-24,-18);x.lineTo(-18,32);x.quadraticCurveTo(0,39,18,32);x.lineTo(24,-18);x.closePath();x.fill();x.strokeStyle='#c4f9ff';x.lineWidth=2;x.stroke();x.fillStyle='#082449';x.beginPath();x.ellipse(0,-19,23,7,0,0,Math.PI*2);x.fill();for(let i=0;i<cup.fill;i++){let bx=-13+(i%4)*9,by=25-Math.floor(i/4)*8;x.fillStyle='#e71127';x.beginPath();x.arc(bx,by,4,0,7);x.fill()}x.restore()}
function ball(b){x.save();x.translate(b.x,b.y);let g=x.createRadialGradient(-4,-5,1,0,0,12);g.addColorStop(0,'#fff');g.addColorStop(.17,'#ff9a9e');g.addColorStop(.52,'#ee1e32');g.addColorStop(1,'#90000e');x.fillStyle=g;x.beginPath();x.arc(0,0,10,0,7);x.fill();x.restore()}
function targetCup(){return cups.map(q=>({q,p:cupPos(q)})).reduce((best,item)=>Math.abs(item.p.x-W/2)<Math.abs(best.p.x-W/2)?item:best)}
function sound(kind){try{audio??=new (window.AudioContext||window.webkitAudioContext)();if(audio.state==='suspended')audio.resume();let now=audio.currentTime,osc=audio.createOscillator(),gain=audio.createGain();osc.connect(gain).connect(audio.destination);if(kind==='ding'){osc.type='sine';osc.frequency.setValueAtTime(880,now);osc.frequency.setValueAtTime(1320,now+.07);gain.gain.setValueAtTime(.12,now);gain.gain.exponentialRampToValueAtTime(.001,now+.32);osc.start(now);osc.stop(now+.33)}else{osc.type='sawtooth';osc.frequency.setValueAtTime(155,now);osc.frequency.exponentialRampToValueAtTime(72,now+.18);gain.gain.setValueAtTime(.09,now);gain.gain.exponentialRampToValueAtTime(.001,now+.2);osc.start(now);osc.stop(now+.21)}}catch(e){}}
function background(){x.clearRect(0,0,W,H);for(let i=0;i<28;i++){let xx=(i*97)%W,yy=(i*61)%H;x.fillStyle='#a4d5ff20';x.fillRect(xx,yy,2,2)}let beam=x.createLinearGradient(0,0,0,H*.31);beam.addColorStop(0,'#79dfff55');beam.addColorStop(.2,'#aeeeff20');beam.addColorStop(1,'#03061300');x.fillStyle=beam;x.fillRect(W/2-27,0,54,H*.34);x.strokeStyle='#5276b8';x.lineWidth=5;x.beginPath();x.moveTo(0,H*.62+40);x.lineTo(W,H*.62+40);x.moveTo(0,H*.62+55);x.lineTo(W,H*.62+55);x.stroke();
  /* launcher: hopper, body, indicator lights and nozzle */
  x.save();x.translate(W/2,0);x.fillStyle='#0a1024';x.fillRect(-72,0,144,39);x.strokeStyle='#9fc7ff';x.lineWidth=2;x.strokeRect(-72,0,144,39);x.fillStyle='#344b78';x.beginPath();x.moveTo(-49,7);x.lineTo(49,7);x.lineTo(33,43);x.lineTo(-33,43);x.closePath();x.fill();x.strokeStyle='#d5edff';x.stroke();x.fillStyle='#172645';x.fillRect(-37,35,74,43);x.strokeStyle='#83b5e6';x.strokeRect(-37,35,74,43);x.fillStyle='#080e1e';x.fillRect(-20,76,40,23);x.fillStyle='#b9eaff';x.fillRect(-15,94,30,13);x.fillStyle='#273d68';x.fillRect(-28,106,56,12);x.strokeStyle='#d5f7ff';x.strokeRect(-28,106,56,12);for(let b of [-57,57]){x.fillStyle='#99eaff';x.beginPath();x.arc(b,20,5,0,7);x.fill()}for(let b of [-22,0,22]){x.fillStyle=b===0?'#ff5a70':'#55e6ff';x.beginPath();x.arc(b,52,4,0,7);x.fill()}x.restore()}
function draw(){background();cups.map(q=>({q,p:cupPos(q)})).sort((a,b)=>a.p.x-b.p.x).forEach(v=>drawCup(v.p,v.q));x.strokeStyle='#72e8ff';x.lineWidth=2;x.beginPath();x.moveTo(W/2-38,H*.62+57);x.lineTo(W/2+38,H*.62+57);x.stroke();balls.forEach(ball);x.fillStyle='#b9d3ff';x.font='700 10px system-ui';x.textAlign='center';x.fillText('DROP ONLY WHEN A JAR IS UNDER THE MACHINE',W/2,H-18)}
function release(){if(!run||dropped>=50||performance.now()<nextDrop)return;dropped++;leftEl.textContent=50-dropped;nextDrop=performance.now()+80;dropBtn.classList.add('pressed');setTimeout(()=>dropBtn.classList.remove('pressed'),55);balls.push({x:W/2,y:H*.20,vy:220})}
function loop(t){if(!run)return;let dt=Math.min(.035,(t-last)/1000||0);last=t;angle+=dt*1.68;let remaining=Math.max(0,45-(t-startAt)/1000);timeEl.textContent=Math.ceil(remaining);for(let i=balls.length-1;i>=0;i--){let b=balls[i],old=b.y;b.vy+=1700*dt;b.y+=b.vy*dt;let target=targetCup(),p=target.p,landed=old<p.y-20&&b.y>=p.y-20&&Math.abs(b.x-p.x)<25;if(landed){balls.splice(i,1);target.q.fill++;caught++;caughtEl.textContent=caught;sound('ding');continue}if(b.y>H+20){balls.splice(i,1);sound('error')}}draw();if(caught===50)return finish(true);if(remaining<=0||(dropped===50&&balls.length===0))return finish(false);raf=requestAnimationFrame(loop)}
function start(){balls=[];cups.forEach(q=>q.fill=0);caught=dropped=0;angle=0;timeEl.textContent=45;caughtEl.textContent=0;leftEl.textContent=50;overlay.style.display='none';run=true;startAt=performance.now();last=startAt;raf=requestAnimationFrame(loop)}
function finish(win){run=false;cancelAnimationFrame(raf);overlay.style.display='grid';panel.innerHTML=win?'<h1>JACKPOT!</h1><p>You caught all 50 balls with <b>'+timeEl.textContent+' seconds</b> on the clock.</p><button id="start">PLAY AGAIN</button>':'<h1>GAME OVER</h1><p>You caught <b>'+caught+' of 50</b>. The key is to tap only when a cup is under the chute.</p><button id="start">TRY AGAIN</button>';document.querySelector('#start').onclick=start}
dropBtn.onclick=release;document.querySelector('#start').onclick=start;addEventListener('keydown',e=>{if(e.code==='Space'){e.preventDefault();release()}});draw()})();
</script></body></html>
