<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Drop Zone 50</title>
  <style>
    :root{color-scheme:dark}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:radial-gradient(circle at 50% 0,#253572,#080b1c 62%);font-family:Arial,Helvetica,sans-serif;color:#fff;overflow:hidden}
    #machine{width:min(100vw,650px);height:min(100vh,900px);min-height:620px;position:relative;overflow:hidden;border:10px solid #ecf8ff;border-radius:36px;background:linear-gradient(90deg,#cf1235 0 4%,#fff 4% 7%,#167dc4 7% 10%,#0874be 10% 90%,#fff 90% 93%,#cf1235 93% 100%);box-shadow:0 0 0 5px #d20d32,0 24px 75px #000b}
    #machine:before,#machine:after{content:"";position:absolute;z-index:3;pointer-events:none;inset:0;border-radius:25px;background:linear-gradient(115deg,#fff0 25%,#fff4 45%,#fff0 58%);opacity:.23}#machine:after{background:repeating-linear-gradient(90deg,#0000 0 8px,#0002 9px 10px);opacity:.16}
    header{height:177px;position:relative;z-index:4;display:grid;place-items:center;text-align:center;padding-top:8px;background:radial-gradient(ellipse at 50% 3%,#fff,#d5f7ff 31%,#2b9ad5 33%,#0b528f 73%);border-bottom:7px solid #e81c3b;box-shadow:inset 0 -12px #064c89,0 4px 8px #001a}
    .brand{font:900 clamp(31px,7vw,50px)/.85 Arial,sans-serif;letter-spacing:-3px;color:#ed1737;text-shadow:1px 2px #fff,3px 4px #8c0922}.brand span{color:#0a73bb}.tag{margin-top:9px;color:#0a4d82;font:900 10px Arial,sans-serif;letter-spacing:3px}.reward{position:absolute;right:20px;bottom:12px;width:77px;height:37px;border-radius:7px;background:#fff;border:3px solid #f01b3a;color:#e71637;font:900 10px/11px Arial;display:grid;place-items:center;box-shadow:0 2px 4px #003b}
    #scorebar{position:relative;z-index:4;height:116px;padding:12px 23px 10px;display:flex;align-items:center;justify-content:space-between;background:linear-gradient(120deg,#0b84c7,#1ac1df 50%,#0873b5);border-bottom:5px solid #f8ffff;box-shadow:inset 0 3px #fff9,inset 0 -9px #075e9b}
    .dial{width:90px;height:90px;position:relative;border:8px solid #42e67c;border-right-color:#f02e4c;border-bottom-color:#f02e4c;border-radius:50%;background:#dffaff;box-shadow:inset 0 0 0 5px #155d90,0 3px 6px #003a6d}.dial:after{content:"";position:absolute;left:43%;bottom:43%;width:5px;height:34px;transform-origin:bottom;transform:rotate(-48deg);background:#07558d;border-radius:4px;box-shadow:0 0 2px #fff}.dial-label{position:absolute;inset:31px -12px auto;text-align:center;color:#075180;font:900 10px Arial;letter-spacing:1px}.dial-num{position:absolute;inset:44px 0 auto;text-align:center;color:#083f6f;font:900 22px Arial}
    .screen-title{font:900 18px Arial;color:#fff;text-shadow:2px 2px #0b518b;letter-spacing:1px}.screen-title small{display:block;color:#d9f7ff;font-size:9px;letter-spacing:2px;margin-bottom:3px}.balls{width:112px;height:88px;border:5px solid #fff;border-radius:50%;background:#b8edffcc;position:relative;display:grid;place-items:center;box-shadow:inset 0 0 0 4px #55a8d0,0 2px 6px #003c70}.balls:before{content:"";position:absolute;inset:8px;border-radius:50%;background:radial-gradient(circle at 30% 25%,#fff 0 5%,#f35 7% 17%,transparent 19%) 9px 5px/25px 22px,radial-gradient(circle at 30% 25%,#fff 0 5%,#f35 7% 17%,transparent 19%) 0 0/26px 24px;opacity:.85}.balls strong{position:relative;z-index:1;color:#e61535;font:900 32px Arial;text-shadow:1px 2px #fff}.balls b{position:absolute;top:-15px;font:900 10px Arial;color:#fff;letter-spacing:1px;text-shadow:1px 1px #07517e}
    #stage{position:absolute;z-index:2;left:21px;right:21px;top:302px;bottom:109px;overflow:hidden;border:7px solid #f7ffff;border-radius:18px;background:radial-gradient(ellipse at 50% 4%,#c2f8ff,#158cca 42%,#093c78 100%);box-shadow:inset 0 0 0 4px #095886,inset 0 0 42px #00234b,0 5px 8px #003}
    canvas{width:100%;height:100%;display:block}#controls{position:absolute;z-index:5;inset:auto 0 0;height:110px;display:grid;place-items:center;background:linear-gradient(#f7ffff,#b9e6f7 25%,#277bab 27%,#09436f);border-top:5px solid #e91c3a}#drop{width:218px;height:63px;border:5px solid #fff;border-radius:35px;background:radial-gradient(circle at 30% 22%,#ff9da9,#ed2643 45%,#a4001e);color:#fff;font:900 19px Arial;letter-spacing:1px;text-shadow:0 2px #790015;box-shadow:0 7px #65000f,0 10px 15px #002a;cursor:pointer;touch-action:manipulation}#drop:active,#drop.down{transform:translateY(5px);box-shadow:0 2px #65000f}#how{position:absolute;bottom:6px;color:#003f6b;font:900 10px Arial;letter-spacing:1.4px}
    #overlay{position:absolute;z-index:20;inset:0;display:grid;place-items:center;padding:24px;background:#071438d9;backdrop-filter:blur(5px)}.card{max-width:430px;text-align:center;padding:29px 27px;border:4px solid #fff;border-radius:22px;background:linear-gradient(150deg,#238bc9,#06437e);box-shadow:0 12px 40px #000}.card h1{margin:0 0 12px;color:#fff;font:900 34px Arial;text-shadow:3px 3px #d10d31}.card p{margin:0 0 22px;font:600 16px/1.45 Arial;color:#e2f8ff}.card button{border:3px solid #fff;border-radius:999px;padding:12px 28px;background:#ec2142;color:#fff;font:900 16px Arial;cursor:pointer;box-shadow:0 4px #890016}
    @media(max-width:500px){#machine{height:100vh;border-width:5px;border-radius:0}.brand{font-size:37px}#scorebar{padding-inline:11px}.dial{transform:scale(.84)}.balls{transform:scale(.84)}#stage{left:10px;right:10px}.screen-title{font-size:14px}}
  </style>
</head>
<body><main id="machine"><header><div class="brand">DROP <span>ZONE</span></div><div class="tag">50 BALL SKILL CHALLENGE</div><div class="reward">CATCH ALL<br>50 TO WIN!</div></header><section id="scorebar"><div class="dial"><div class="dial-label">TIME</div><div class="dial-num" id="time">45</div></div><div class="screen-title"><small>THE FAST DROP GAME</small>TIME YOUR SHOT</div><div class="balls"><b>BALLS LEFT</b><strong id="left">50</strong></div></section><div id="stage"><canvas id="game"></canvas></div><section id="controls"><button id="drop">DROP BALL</button><div id="how">DROP ONLY WHEN A CUP IS BELOW THE LAUNCHER</div></section><div id="overlay"><section class="card" id="card"><h1>DROP ZONE 50</h1><p>Press the button when a cup is directly below the launcher. Catch all 50 red balls before time runs out.</p><button id="start">START GAME</button></section></div></main>
<script>
(()=>{const canvas=document.querySelector('#game'),ctx=canvas.getContext('2d'),stage=document.querySelector('#stage'),drop=document.querySelector('#drop'),overlay=document.querySelector('#overlay'),card=document.querySelector('#card'),timeEl=document.querySelector('#time'),leftEl=document.querySelector('#left');let W,H,run=false,started,last,phase=0,dropped=0,caught=0,balls=[],nextDrop=0,raf,audio;const cups=Array.from({length:9},(_,slot)=>({slot,fill:0}));
function resize(){let r=stage.getBoundingClientRect(),d=devicePixelRatio;canvas.width=r.width*d;canvas.height=r.height*d;ctx.setTransform(d,0,0,d,0,0);W=r.width;H=r.height}addEventListener('resize',resize);resize();
function pos(cup){let gap=Math.min(82,W*.15),track=W+gap*2;return{x:((phase*120+cup.slot*gap)%track)-gap,y:H*.67}}
function active(){return cups.map(q=>({q,p:pos(q)})).reduce((a,b)=>Math.abs(a.p.x-W/2)<Math.abs(b.p.x-W/2)?a:b)}
function sfx(type){try{audio??=new(window.AudioContext||window.webkitAudioContext)();if(audio.state==='suspended')audio.resume();let n=audio.currentTime,o=audio.createOscillator(),g=audio.createGain();o.connect(g).connect(audio.destination);if(type==='win'){o.type='sine';o.frequency.setValueAtTime(900,n);o.frequency.setValueAtTime(1300,n+.08);g.gain.setValueAtTime(.13,n);g.gain.exponentialRampToValueAtTime(.001,n+.32);o.start(n);o.stop(n+.33)}else{o.type='sawtooth';o.frequency.setValueAtTime(170,n);o.frequency.exponentialRampToValueAtTime(70,n+.18);g.gain.setValueAtTime(.075,n);g.gain.exponentialRampToValueAtTime(.001,n+.2);o.start(n);o.stop(n+.21)}}catch(e){}}
function cup(p,c){ctx.save();ctx.translate(p.x,p.y);ctx.fillStyle='#e9fbffbb';ctx.beginPath();ctx.moveTo(-28,-19);ctx.lineTo(-22,39);ctx.quadraticCurveTo(0,49,22,39);ctx.lineTo(28,-19);ctx.closePath();ctx.fill();ctx.strokeStyle='#9beaff';ctx.lineWidth=4;ctx.stroke();ctx.fillStyle='#092944';ctx.beginPath();ctx.ellipse(0,-19,28,10,0,0,7);ctx.fill();ctx.strokeStyle='#d4ffff';ctx.lineWidth=5;ctx.stroke();ctx.fillStyle='#2676a4';ctx.beginPath();ctx.ellipse(0,-19,20,6,0,0,7);ctx.fill();for(let i=0;i<c.fill;i++){ctx.fillStyle='#e01938';ctx.beginPath();ctx.arc(-12+(i%4)*8,33-Math.floor(i/4)*8,4,0,7);ctx.fill()}ctx.restore()}
function ball(b){let g=ctx.createRadialGradient(b.x-4,b.y-5,1,b.x,b.y,12);g.addColorStop(0,'#fff');g.addColorStop(.15,'#ffadb5');g.addColorStop(.47,'#ef1737');g.addColorStop(1,'#870013');ctx.fillStyle=g;ctx.beginPath();ctx.arc(b.x,b.y,10,0,7);ctx.fill()}
function launcher(){ctx.save();ctx.translate(W/2,0);ctx.fillStyle='#edfaff';ctx.fillRect(-71,0,142,38);ctx.strokeStyle='#1d74a5';ctx.lineWidth=3;ctx.strokeRect(-71,0,142,38);ctx.fillStyle='#e5203f';ctx.beginPath();ctx.moveTo(-46,6);ctx.lineTo(46,6);ctx.lineTo(30,44);ctx.lineTo(-30,44);ctx.closePath();ctx.fill();ctx.strokeStyle='#fff';ctx.stroke();ctx.fillStyle='#e8faff';ctx.fillRect(-34,42,68,48);ctx.strokeStyle='#1173a8';ctx.strokeRect(-34,42,68,48);ctx.fillStyle='#183b66';ctx.fillRect(-19,87,38,22);ctx.fillStyle='#f8ffff';ctx.fillRect(-27,106,54,13);ctx.strokeStyle='#0d5c92';ctx.strokeRect(-27,106,54,13);for(let k of[-54,54]){ctx.fillStyle='#ff2444';ctx.beginPath();ctx.arc(k,20,5,0,7);ctx.fill()}ctx.restore()}
function draw(){ctx.clearRect(0,0,W,H);let g=ctx.createLinearGradient(0,0,0,H);g.addColorStop(0,'#c5f8ff');g.addColorStop(.18,'#237cb6');g.addColorStop(1,'#053266');ctx.fillStyle=g;ctx.fillRect(0,0,W,H);ctx.fillStyle='#77dcf433';ctx.fillRect(W/2-26,0,52,H*.58);launcher();ctx.strokeStyle='#b9eeff';ctx.lineWidth=5;ctx.beginPath();ctx.moveTo(0,H*.67+55);ctx.lineTo(W,H*.67+55);ctx.moveTo(0,H*.67+70);ctx.lineTo(W,H*.67+70);ctx.stroke();cups.map(q=>({q,p:pos(q)})).sort((a,b)=>a.p.x-b.p.x).forEach(v=>cup(v.p,v.q));let a=active();ctx.strokeStyle='#fff5';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(W/2,H*.67+55);ctx.lineTo(W/2,H*.67+74);ctx.stroke();balls.forEach(ball);ctx.fillStyle='#dffaff';ctx.font='900 11px Arial';ctx.textAlign='center';ctx.fillText('CATCH: '+caught+' / 50',W/2,H-15)}
function release(){if(!run||dropped>=50||performance.now()<nextDrop)return;dropped++;leftEl.textContent=50-dropped;nextDrop=performance.now()+85;drop.classList.add('down');setTimeout(()=>drop.classList.remove('down'),55);balls.push({x:W/2,y:H*.22,vy:235})}
function loop(now){if(!run)return;let dt=Math.min(.035,(now-last)/1000||0);last=now;phase+=dt*1.7;let remaining=Math.max(0,45-(now-started)/1000);timeEl.textContent=Math.ceil(remaining);for(let i=balls.length-1;i>=0;i--){let b=balls[i],old=b.y;b.vy+=1760*dt;b.y+=b.vy*dt;let a=active(),p=a.p;if(old<p.y-19&&b.y>=p.y-19&&Math.abs(b.x-p.x)<25){balls.splice(i,1);a.q.fill++;caught++;sfx('win');continue}if(b.y>H+20){balls.splice(i,1);sfx('miss')}}draw();if(caught===50)return done(true);if(remaining<=0||(dropped===50&&!balls.length))return done(false);raf=requestAnimationFrame(loop)}
function start(){cups.forEach(c=>c.fill=0);balls=[];dropped=caught=phase=0;leftEl.textContent=50;timeEl.textContent=45;overlay.style.display='none';run=true;started=last=performance.now();raf=requestAnimationFrame(loop)}
function done(win){run=false;cancelAnimationFrame(raf);overlay.style.display='grid';card.innerHTML=win?'<h1>JACKPOT!</h1><p>You caught every one of the 50 balls.</p><button id="start">PLAY AGAIN</button>':'<h1>TIME UP!</h1><p>You caught '+caught+' of 50 balls. Watch for the cup directly beneath the launcher.</p><button id="start">TRY AGAIN</button>';document.querySelector('#start').onclick=start}
drop.onclick=release;document.querySelector('#start').onclick=start;addEventListener('keydown',e=>{if(e.code==='Space'){e.preventDefault();release()}});draw()})();
</script></main></body></html>
