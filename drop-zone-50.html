<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Drop Zone 50 — 3D</title>
  <style>
    *{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:radial-gradient(circle at 50% 0,#273968,#050712 68%);font-family:Arial,sans-serif;color:#fff;overflow:hidden}#cabinet{width:min(100vw,720px);height:min(100vh,910px);min-height:590px;position:relative;overflow:hidden;border:8px solid #f7fcff;border-radius:30px;background:linear-gradient(90deg,#d7072f 0 3%,#fff 3% 5%,#126bb7 5% 95%,#fff 95% 97%,#d7072f 97%);box-shadow:0 0 0 5px #a8001d,0 26px 80px #000d}#top{height:152px;position:relative;z-index:5;display:flex;align-items:center;justify-content:space-between;padding:16px 27px;background:radial-gradient(ellipse at 50% -20%,#fff,#b5eaff 38%,#0867aa 70%);border-bottom:6px solid #e51d3b;box-shadow:inset 0 -9px #03487f}.logo{font:900 clamp(28px,7vw,48px)/.8 Arial,sans-serif;letter-spacing:-3px;color:#e81338;text-shadow:1px 2px #fff,3px 4px #850018}.logo b{color:#086eb3}.sub{margin-top:10px;font:900 10px Arial;letter-spacing:2.4px;color:#064878}.dial{width:94px;height:94px;border-radius:50%;border:9px solid #38df79;border-right-color:#eb2945;border-bottom-color:#eb2945;background:#dcf8ff;box-shadow:inset 0 0 0 5px #14628e,0 3px 6px #003b66;display:grid;place-items:center;color:#064e7d;text-align:center}.dial span{display:block;font:900 10px Arial;letter-spacing:1px}.dial strong{display:block;font:900 28px Arial}.dial:after{content:"";position:absolute}.score{position:absolute;z-index:6;right:23px;top:161px;width:122px;text-align:center;color:#fff;text-shadow:1px 2px #06436f;font:900 10px Arial;letter-spacing:1px}.score strong{display:block;font:900 37px Arial;color:#e61d3c;text-shadow:1px 2px #fff,2px 3px #8a0020}.score em{font-style:normal;color:#dff8ff;font-size:9px}.stage{position:absolute;z-index:1;inset:152px 15px 96px;border:6px solid #eaffff;border-radius:17px;overflow:hidden;background:#071c3a;box-shadow:inset 0 0 0 3px #095588,inset 0 0 45px #000}canvas{width:100%;height:100%;display:block}.caption{position:absolute;z-index:7;top:169px;left:21px;right:145px;text-align:center;color:#efffff;text-shadow:1px 2px #06416e;font:900 11px Arial;letter-spacing:1px}.caption b{display:block;font-size:14px;margin-top:4px}.controls{position:absolute;z-index:8;inset:auto 0 0;height:102px;display:grid;place-items:center;background:linear-gradient(#edfaff,#b8e9ff 27%,#126a9e 30%,#07385f);border-top:5px solid #e81b3d}.drop{width:218px;height:61px;border:5px solid #fff;border-radius:35px;background:radial-gradient(circle at 30% 18%,#ff9eac,#ef2140 45%,#9b001d);box-shadow:0 7px #680010,0 12px 18px #002a4d;color:#fff;font:900 18px Arial;letter-spacing:1px;text-shadow:0 2px #770014;cursor:pointer;touch-action:manipulation}.drop:active,.drop.down{transform:translateY(5px);box-shadow:0 2px #680010}.how{position:absolute;bottom:7px;color:#003f6d;font:900 9px Arial;letter-spacing:1.2px}.overlay{position:absolute;z-index:20;inset:0;display:grid;place-items:center;background:#061337d9;backdrop-filter:blur(5px);padding:24px}.card{max-width:420px;padding:28px;text-align:center;border:4px solid #fff;border-radius:22px;background:linear-gradient(145deg,#278cca,#063d75);box-shadow:0 14px 40px #000}.card h1{margin:0 0 12px;font:900 35px Arial;color:#fff;text-shadow:3px 3px #cb0d2d}.card p{font:600 16px/1.45 Arial;color:#e4faff}.card button{border:3px solid #fff;border-radius:99px;padding:12px 27px;background:#ea2140;color:#fff;font:900 16px Arial;cursor:pointer;box-shadow:0 4px #810013}@media(max-width:520px){#cabinet{height:100vh;border-radius:0;border-width:4px}.stage{left:7px;right:7px}.caption{left:8px}.score{right:8px}.logo{font-size:33px}.dial{width:78px;height:78px}.score strong{font-size:29px}}
  </style>
</head>
<body><main id="cabinet"><header id="top"><div><div class="logo">DROP <b>ZONE</b></div><div class="sub">50 BALL 3D CHALLENGE</div></div><div class="dial"><div><span>TIME</span><strong id="time">45</strong></div></div></header><div class="caption">3D ARCADE CHALLENGE<b>DROP WHEN A CUP IS UNDER THE LAUNCHER</b></div><div class="score">BALLS LEFT<strong id="left">50</strong><em>CAUGHT: <span id="caught">0</span> / 50</em></div><div class="stage" id="stage"></div><section class="controls"><button class="drop" id="drop">DROP BALL</button><div class="how">CLICK OR PRESS SPACE • ONLY THE CUP UNDER THE LAUNCHER COUNTS</div></section><div class="overlay" id="overlay"><section class="card" id="card"><h1>DROP ZONE 50</h1><p>A real 3D arcade game. Time your drops so the moving cup reaches the launcher as the ball lands.</p><button id="start">START GAME</button></section></div></main>
<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.187.0/build/three.module.js';
const holder=document.querySelector('#stage'),timeEl=document.querySelector('#time'),leftEl=document.querySelector('#left'),caughtEl=document.querySelector('#caught'),dropBtn=document.querySelector('#drop'),overlay=document.querySelector('#overlay'),card=document.querySelector('#card');
const scene=new THREE.Scene();scene.background=new THREE.Color(0x082851);scene.fog=new THREE.Fog(0x082851,9,19);const camera=new THREE.PerspectiveCamera(43,1,.1,50);camera.position.set(0,2.2,13);camera.lookAt(0,.15,0);const renderer=new THREE.WebGLRenderer({antialias:true});renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;holder.append(renderer.domElement);
const hemi=new THREE.HemisphereLight(0xc9f6ff,0x061125,2.2);scene.add(hemi);const key=new THREE.SpotLight(0xd6f8ff,95,24,Math.PI/5,.45,1);key.position.set(0,7,5);key.target.position.set(0,-2,0);key.castShadow=true;scene.add(key,key.target);const redLight=new THREE.PointLight(0xff173c,16,6);redLight.position.set(0,3,2);scene.add(redLight);
const mat=(color,rough=.45,metal=.05)=>new THREE.MeshStandardMaterial({color,roughness:rough,metalness:metal});const glass=new THREE.MeshPhysicalMaterial({color:0xa9efff,transparent:true,opacity:.45,roughness:.1,metalness:.05,side:THREE.DoubleSide});
function box(w,h,d,color,x=0,y=0,z=0){const m=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),mat(color));m.position.set(x,y,z);m.castShadow=m.receiveShadow=true;scene.add(m);return m}function cyl(r,h,color,x=0,y=0,z=0){const m=new THREE.Mesh(new THREE.CylinderGeometry(r,r,h,32),mat(color,.32,.12));m.position.set(x,y,z);m.castShadow=m.receiveShadow=true;scene.add(m);return m}
box(12,.45,2.8,0x043463,0,-2.8,0);box(12,.12,3,0x73e5ff,0,-2.55,.1);box(12,.25,.18,0xe32242,0,-2.4,-.9);box(12,.25,.18,0xe32242,0,-2.4,1.1);box(12,.22,1.2,0x0b6096,0,-1.7,0);
const launcher=new THREE.Group();scene.add(launcher);const la=(geo,color,x,y,z)=>{let m=new THREE.Mesh(geo,mat(color,.28,.25));m.position.set(x,y,z);m.castShadow=true;launcher.add(m);return m};la(new THREE.BoxGeometry(2.65,.5,1),0xe5f9ff,0,3.55,0);la(new THREE.CylinderGeometry(.75,.95,1.3,32),0xe52241,0,3.0,0);la(new THREE.BoxGeometry(1.55,1.2,1),0xecfaff,0,2.25,0);la(new THREE.CylinderGeometry(.45,.48,.52,32),0x163b61,0,1.48,0);la(new THREE.CylinderGeometry(.6,.6,.18,32),0xeefeff,0,1.21,0);for(const x of[-1.08,1.08])la(new THREE.SphereGeometry(.11,16,16),0xff2948,x,3.55,.55);
const cupData=[];function makeCup(slot){const g=new THREE.Group(),outer=new THREE.Mesh(new THREE.CylinderGeometry(.58,.48,1.12,32,1,true),glass);outer.position.y=-1.62;outer.castShadow=true;g.add(outer);const rim=new THREE.Mesh(new THREE.TorusGeometry(.59,.065,10,32),mat(0xd7faff,.2,.2));rim.rotation.x=Math.PI/2;rim.position.y=-1.07;g.add(rim);const base=new THREE.Mesh(new THREE.CylinderGeometry(.49,.53,.12,32),mat(0x2394c9));base.position.y=-2.19;g.add(base);const label=new THREE.Mesh(new THREE.BoxGeometry(.5,.28,.03),mat(0xe9faff));label.position.set(0,-1.58,.51);g.add(label);scene.add(g);cupData.push({g,slot,fill:0})}for(let i=0;i<9;i++)makeCup(i);
const ballGeo=new THREE.SphereGeometry(.18,22,22),ballMat=new THREE.MeshStandardMaterial({color:0xe81739,roughness:.2,metalness:.1});const movingBalls=[];function addBall(x,y,z=.1){let m=new THREE.Mesh(ballGeo,ballMat);m.position.set(x,y,z);m.castShadow=true;scene.add(m);return m}function storeBall(c){let m=new THREE.Mesh(new THREE.SphereGeometry(.09,14,14),ballMat);m.position.set(((c.fill%3)-1)*.17,-1.87,.12+Math.floor(c.fill/3)*.13);m.castShadow=true;c.g.add(m)}
let run=false,started=0,last=0,phase=0,dropped=0,caught=0,nextDrop=0,audio;function cupX(c){let gap=1.3,track=11.7;return((phase*2.1+c.slot*gap)%track)-track/2}function activeCup(){return cupData.reduce((best,c)=>Math.abs(cupX(c))<Math.abs(cupX(best))?c:best)}
function tone(ok){try{audio??=new(window.AudioContext||window.webkitAudioContext)();if(audio.state==='suspended')audio.resume();let t=audio.currentTime,o=audio.createOscillator(),g=audio.createGain();o.connect(g).connect(audio.destination);if(ok){o.type='sine';o.frequency.setValueAtTime(880,t);o.frequency.setValueAtTime(1320,t+.08);g.gain.setValueAtTime(.14,t);g.gain.exponentialRampToValueAtTime(.001,t+.32);o.start(t);o.stop(t+.34)}else{o.type='sawtooth';o.frequency.setValueAtTime(155,t);o.frequency.exponentialRampToValueAtTime(70,t+.2);g.gain.setValueAtTime(.08,t);g.gain.exponentialRampToValueAtTime(.001,t+.21);o.start(t);o.stop(t+.22)}}catch(e){}}
function resize(){let r=holder.getBoundingClientRect();renderer.setSize(r.width,r.height,false);camera.aspect=r.width/r.height;camera.updateProjectionMatrix()}addEventListener('resize',resize);resize();
function release(){if(!run||dropped>=50||performance.now()<nextDrop)return;dropped++;leftEl.textContent=50-dropped;nextDrop=performance.now()+110;dropBtn.classList.add('down');setTimeout(()=>dropBtn.classList.remove('down'),60);let b=addBall(0,1.1,.1);movingBalls.push({m:b,age:0,start:performance.now(),tested:false})}
function update(now){let dt=Math.min(.034,(now-last)/1000||0);last=now;phase+=dt;let remain=Math.max(0,45-(now-started)/1000);timeEl.textContent=Math.ceil(remain);cupData.forEach(c=>{c.g.position.x=cupX(c);c.g.rotation.y=Math.sin(c.g.position.x)*.08});for(let i=movingBalls.length-1;i>=0;i--){let b=movingBalls[i],age=(now-b.start)/1000;b.age=age;b.m.position.y=1.1-4.8*age*age-2.05*age;if(!b.tested&&b.m.position.y<-1.03){b.tested=true;let a=activeCup();if(Math.abs(a.g.position.x)<.34){caught++;caughtEl.textContent=caught;tone(true);storeBall(a);a.fill++;scene.remove(b.m);movingBalls.splice(i,1);continue}}if(b.m.position.y<-3.3){scene.remove(b.m);movingBalls.splice(i,1);tone(false)}}if(caught===50)return finish(true);if(remain<=0||(dropped===50&&!movingBalls.length))return finish(false)}
function animate(now){requestAnimationFrame(animate);if(run)update(now);launcher.rotation.y=Math.sin(now*.0018)*.025;redLight.intensity=12+Math.sin(now*.009)*5;renderer.render(scene,camera)}requestAnimationFrame(animate);
function start(){cupData.forEach(c=>{c.fill=0;c.g.children.filter(x=>x.geometry&&x.geometry.parameters&&x.geometry.parameters.radius===.09).forEach(x=>c.g.remove(x))});movingBalls.splice(0).forEach(b=>scene.remove(b.m));dropped=caught=phase=0;leftEl.textContent=50;caughtEl.textContent=0;timeEl.textContent=45;overlay.style.display='none';run=true;started=last=performance.now()}
function finish(win){run=false;overlay.style.display='grid';card.innerHTML=win?'<h1>JACKPOT!</h1><p>You caught every ball in the 3D cabinet.</p><button id="start">PLAY AGAIN</button>':'<h1>TIME UP!</h1><p>You caught '+caught+' of 50. Drop a little before the cup reaches the launcher.</p><button id="start">TRY AGAIN</button>';document.querySelector('#start').onclick=start}
dropBtn.onclick=release;document.querySelector('#start').onclick=start;addEventListener('keydown',e=>{if(e.code==='Space'){e.preventDefault();release()}});
</script></main></body></html>
