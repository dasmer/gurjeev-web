<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>QB Precision</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Nunito:wght@700;800&display=swap');
    * { box-sizing: border-box; }
    body { margin:0; min-height:100vh; display:grid; place-items:center; color:#f8f4df; background:#071c18; font-family:Nunito,system-ui,sans-serif; overflow:hidden; }
    .game { width:min(1100px,100vw); padding:18px; }
    .top { display:flex; align-items:end; justify-content:space-between; gap:12px; margin:0 auto 12px; max-width:1000px; }
    h1 { margin:0; font:800 clamp(26px,4vw,44px)/.85 'Barlow Condensed',sans-serif; letter-spacing:1px; text-transform:uppercase; color:#ffd54a; text-shadow:3px 3px 0 #b93a28; }
    .sub { font-size:12px; color:#a7d8c4; margin-top:6px; letter-spacing:.5px; }
    .scoreboard { display:flex; gap:10px; }
    .stat { background:#10362e; border:1px solid #3e836b; border-radius:8px; min-width:75px; padding:5px 9px; text-align:center; font:700 13px 'Barlow Condensed',sans-serif; letter-spacing:.8px; color:#a7d8c4; }
    .stat b { display:block; font:800 25px/.9 'Barlow Condensed',sans-serif; color:#fff; }
    canvas { display:block; width:100%; aspect-ratio: 5 / 3; max-height:calc(100vh - 120px); margin:auto; border:5px solid #e7d3a3; border-radius:8px; background:#277344; box-shadow:0 0 0 3px #123a2b, 0 20px 45px #0008; touch-action:none; cursor:crosshair; }
    .tip { text-align:center; margin:10px 0 0; min-height:20px; color:#bce3d0; font-size:13px; }
    .tip strong { color:#ffd54a; }
    @media (max-width:560px) { .game{padding:10px}.top{align-items:center}.sub{display:none}.stat{min-width:57px}.scoreboard{gap:5px} canvas{border-width:3px} }
  </style>
</head>
<body>
  <main class="game">
    <div class="top"><div><h1>QB Precision</h1><div class="sub">Hit receivers in stride. Three misses and the drive is over.</div></div><div class="scoreboard"><div class="stat">SCORE<b id="score">0</b></div><div class="stat">MISSES<b id="misses">0 / 3</b></div></div></div>
    <canvas id="field" width="1000" height="600" aria-label="Football passing game"></canvas>
    <p class="tip" id="tip"><strong>Drag from the quarterback</strong> and release to throw. Aim ahead of a receiver!</p>
  </main>
<script>
const c=document.querySelector('#field'), x=c.getContext('2d'), scoreEl=document.querySelector('#score'), missEl=document.querySelector('#misses'), tip=document.querySelector('#tip');
const W=c.width,H=c.height, qb={x:145,y:300}, receivers=[{x:560,y:155,vy:1.25,n:81},{x:670,y:435,vy:-1.08,n:14},{x:805,y:280,vy:.8,n:2}];
let score=0, misses=0, aiming=false, mouse={x:0,y:0}, ball=null, flash='', flashUntil=0, last=performance.now(), gameOver=false;
function pos(e){const r=c.getBoundingClientRect();return{x:(e.clientX-r.left)*W/r.width,y:(e.clientY-r.top)*H/r.height}}
function roundRect(cx,cy,w,h,r,fill){x.beginPath();x.roundRect(cx,cy,w,h,r);x.fillStyle=fill;x.fill()}
function drawField(){
 x.clearRect(0,0,W,H); x.fillStyle='#287746';x.fillRect(0,0,W,H);
 for(let i=0;i<10;i++){x.fillStyle=i%2?'#2b7d49':'#247040';x.fillRect(i*100,0,100,H)}
 x.strokeStyle='#d9e5ca';x.lineWidth=3;x.strokeRect(7,7,W-14,H-14); x.strokeStyle='#d8e1ca';x.globalAlpha=.65;
 for(let i=1;i<10;i++){x.beginPath();x.moveTo(i*100,0);x.lineTo(i*100,H);x.stroke();x.fillStyle='#e6edd5';x.font='700 18px Barlow Condensed';x.textAlign='center';x.fillText(i===5?'50':Math.abs(50-i*10),i*100,28);}
 x.globalAlpha=1;x.fillStyle='#ba342d';x.fillRect(0,0,16,H);x.fillRect(W-16,0,16,H);
 x.strokeStyle='#fff';x.lineWidth=2;x.setLineDash([7,8]);x.beginPath();x.moveTo(240,0);x.lineTo(240,H);x.stroke();x.setLineDash([]);
}
function player(p,type){ const color=type==='qb'?'#f6c342':'#2d6fe8'; x.save();x.translate(p.x,p.y);
 x.fillStyle='#f0b686';x.beginPath();x.arc(0,-25,11,0,7);x.fill();roundRect(-16,-16,32,39,7,color); x.fillStyle='#fff';x.font='800 16px Barlow Condensed';x.textAlign='center';x.fillText(p.n||'QB',0,10);x.strokeStyle='#173e99';x.lineWidth=5;x.beginPath();x.moveTo(-10,24);x.lineTo(-14,42);x.moveTo(10,24);x.lineTo(14,42);x.stroke();x.restore(); }
function football(px,py,ang=0,scale=1){x.save();x.translate(px,py);x.rotate(ang);x.scale(scale,scale);x.fillStyle='#7d321c';x.beginPath();x.ellipse(0,0,13,7,0,0,7);x.fill();x.strokeStyle='#f2ddae';x.lineWidth=1.5;x.beginPath();x.moveTo(-5,0);x.lineTo(5,0);for(let i=-3;i<5;i+=4){x.moveTo(i,-3);x.lineTo(i,3)}x.stroke();x.restore()}
function draw(){drawField();
 receivers.forEach(r=>{x.fillStyle='rgba(255,255,255,.15)';x.beginPath();x.arc(r.x,r.y,34,0,7);x.fill();player(r,'wr')}); player(qb,'qb');
 if(aiming){let dx=mouse.x-qb.x,dy=mouse.y-qb.y,len=Math.hypot(dx,dy), power=Math.min(len/260,1); x.strokeStyle=power>.8?'#ffcf42':'#dcefd9';x.lineWidth=4;x.setLineDash([10,9]);x.beginPath();x.moveTo(qb.x+18,qb.y-16);x.lineTo(mouse.x,mouse.y);x.stroke();x.setLineDash([]);x.fillStyle='#102b25';roundRect(30,535,160,36,18,'#102b25');x.fillStyle='#fff';x.font='800 16px Nunito';x.textAlign='left';x.fillText('THROW POWER  '+Math.round(power*100)+'%',45,559);}
 if(ball) football(ball.x,ball.y,Math.atan2(ball.vy,ball.vx),1.1);
 if(flash && performance.now()<flashUntil){x.font='800 42px Barlow Condensed';x.textAlign='center';x.fillStyle=flash==='COMPLETE!'?'#ffdc4d':'#ff6c5e';x.fillText(flash,W/2,90)}
 if(gameOver){x.fillStyle='#071c18cc';x.fillRect(0,0,W,H);x.textAlign='center';x.fillStyle='#ffdb51';x.font='800 60px Barlow Condensed';x.fillText('DRIVE OVER',W/2,230);x.fillStyle='#fff';x.font='800 26px Nunito';x.fillText('Final score: '+score,W/2,280);roundRect(W/2-120,315,240,55,28,'#f3c83b');x.fillStyle='#11251d';x.font='800 20px Nunito';x.fillText('TAP TO PLAY AGAIN',W/2,350)}
}
function result(good){if(good){score++;flash='COMPLETE!';tip.innerHTML='<strong>Nice throw!</strong> The routes are changing — lead your target.'}else{misses++;flash='INCOMPLETE';tip.innerHTML='<strong>Missed it.</strong> Drag farther to throw harder and lead the receiver.'}flashUntil=performance.now()+800;scoreEl.textContent=score;missEl.textContent=misses+' / 3';if(misses>=3){gameOver=true;tip.textContent='Tap the field to start a new drive.'}}
function reset(){score=misses=0;ball=null;gameOver=false;receivers.splice(0,3,{x:560,y:155,vy:1.25,n:81},{x:670,y:435,vy:-1.08,n:14},{x:805,y:280,vy:.8,n:2});scoreEl.textContent=0;missEl.textContent='0 / 3';tip.innerHTML='<strong>Drag from the quarterback</strong> and release to throw. Aim ahead of a receiver!'}
function loop(t){const dt=Math.min((t-last)/16.67,2);last=t;if(!gameOver){receivers.forEach(r=>{r.y+=r.vy*dt;if(r.y<80||r.y>520)r.vy*=-1});if(ball){ball.x+=ball.vx*dt;ball.y+=ball.vy*dt;let caught=receivers.some(r=>Math.hypot(r.x-ball.x,r.y-ball.y)<33);if(caught){ball=null;result(true)}else if(ball.x>W+20||ball.y<0||ball.y>H){ball=null;result(false)}}}draw();requestAnimationFrame(loop)}
c.addEventListener('pointerdown',e=>{let p=pos(e);if(gameOver){reset();return}if(!ball&&Math.hypot(p.x-qb.x,p.y-qb.y)<55){aiming=true;mouse=p;c.setPointerCapture(e.pointerId);tip.innerHTML='<strong>Release to throw.</strong> A longer drag makes a faster pass.'}});
c.addEventListener('pointermove',e=>{if(aiming)mouse=pos(e)});c.addEventListener('pointerup',e=>{if(!aiming)return;aiming=false;let p=pos(e),dx=p.x-qb.x,dy=p.y-(qb.y-15),d=Math.hypot(dx,dy);if(d<35){tip.innerHTML='<strong>Drag farther!</strong> Start on the QB and pull toward a receiver.';return}let speed=Math.min(10,3+d/38);ball={x:qb.x+22,y:qb.y-15,vx:dx/d*speed,vy:dy/d*speed};tip.textContent='Ball in the air…';});
requestAnimationFrame(loop);
</script>
</body></html>
