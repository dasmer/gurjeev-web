<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Snake</title>
<style>
  :root {
    --bg: #0f1a14;
    --board: #16261c;
    --grid: #1e3327;
    --snake: #6ee7a0;
    --snake-head: #a3f7c0;
    --food: #ff6b5e;
    --text: #eafff0;
    --accent: #6ee7a0;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    height: 100%;
    background: var(--bg);
    color: var(--text);
    font-family: 'Courier New', monospace;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .wrap {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 14px;
    padding: 20px;
  }
  h1 {
    margin: 0;
    letter-spacing: 6px;
    font-size: 22px;
    font-weight: 700;
    color: var(--accent);
    text-transform: uppercase;
  }
  .hud {
    display: flex;
    gap: 24px;
    font-size: 14px;
    letter-spacing: 2px;
    color: #9fd9b4;
  }
  .hud span b { color: var(--text); }
  .topbar {
    position: relative;
    width: 100%;
    display: flex;
    justify-content: center;
  }
  #shopBtn {
    position: absolute;
    right: 0;
    top: 50%;
    transform: translateY(-50%);
    background: var(--grid);
    border: 1px solid #2a4a37;
    color: var(--text);
    width: 38px;
    height: 38px;
    border-radius: 10px;
    font-size: 18px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  #shopBtn .dot {
    position: absolute;
    top: -4px;
    right: -4px;
    width: 10px;
    height: 10px;
    background: var(--food);
    border-radius: 50%;
    display: none;
  }
  #board {
    background: var(--board);
    border: 3px solid var(--grid);
    border-radius: 8px;
    image-rendering: pixelated;
    box-shadow: 0 0 40px rgba(110,231,160,0.08);
  }
  .msg {
    min-height: 20px;
    font-size: 13px;
    color: #9fd9b4;
    letter-spacing: 1px;
    text-align: center;
  }
  .controls {
    display: grid;
    grid-template-columns: repeat(3, 44px);
    grid-template-rows: repeat(2, 44px);
    gap: 6px;
    margin-top: 4px;
  }
  .controls button {
    background: var(--grid);
    border: 1px solid #2a4a37;
    color: var(--text);
    border-radius: 6px;
    font-size: 18px;
    cursor: pointer;
  }
  .controls button:active { background: var(--accent); color: #0f1a14; }
  #up { grid-column: 2; grid-row: 1; }
  #left { grid-column: 1; grid-row: 2; }
  #down { grid-column: 2; grid-row: 2; }
  #right { grid-column: 3; grid-row: 2; }
  button.restart {
    margin-top: 4px;
    background: var(--accent);
    color: #0f1a14;
    border: none;
    padding: 8px 18px;
    border-radius: 20px;
    font-weight: 700;
    letter-spacing: 2px;
    cursor: pointer;
    font-family: inherit;
    display: none;
  }
  @media (hover:hover) {
    .controls { display: none; }
  }

  .overlay {
    position: fixed;
    inset: 0;
    background: rgba(6, 12, 8, 0.82);
    display: none;
    align-items: center;
    justify-content: center;
    z-index: 10;
    padding: 20px;
  }
  .overlay.open { display: flex; }
  .start-panel {
    background: var(--board);
    border: 2px solid var(--grid);
    border-radius: 12px;
    padding: 28px 24px;
    width: 100%;
    max-width: 320px;
    text-align: center;
  }
  .start-panel h2 {
    margin: 0 0 8px;
    font-size: 18px;
    letter-spacing: 3px;
    color: var(--accent);
  }
  .start-panel p {
    margin: 0 0 20px;
    font-size: 12px;
    color: #9fd9b4;
    letter-spacing: 1px;
    line-height: 1.6;
  }
  .start-btn {
    background: var(--accent);
    color: #0f1a14;
    border: none;
    padding: 12px 32px;
    border-radius: 24px;
    font-weight: 700;
    letter-spacing: 3px;
    cursor: pointer;
    font-family: inherit;
    font-size: 14px;
  }
  .shop {
    background: var(--board);
    border: 2px solid var(--grid);
    border-radius: 12px;
    padding: 20px;
    width: 100%;
    max-width: 380px;
    max-height: 80vh;
    overflow-y: auto;
  }
  .shop h2 {
    margin: 0 0 4px;
    font-size: 16px;
    letter-spacing: 3px;
    color: var(--accent);
    text-align: center;
  }
  .shop .sub {
    text-align: center;
    font-size: 11px;
    color: #9fd9b4;
    margin-bottom: 16px;
    letter-spacing: 1px;
  }
  .skin-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 10px;
  }
  .skin-card {
    background: var(--grid);
    border: 2px solid #2a4a37;
    border-radius: 10px;
    padding: 10px 6px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 6px;
    cursor: pointer;
    position: relative;
  }
  .skin-card.selected { border-color: var(--accent); box-shadow: 0 0 12px rgba(110,231,160,0.3); }
  .skin-card.locked { opacity: 0.45; cursor: default; }
  .skin-swatch {
    width: 40px;
    height: 40px;
    border-radius: 8px;
    display: block;
  }
  .skin-name {
    font-size: 10px;
    letter-spacing: 1px;
    text-align: center;
    color: var(--text);
  }
  .skin-req {
    font-size: 9px;
    color: #6f9c81;
  }
  .shop-close {
    margin: 16px auto 0;
    display: block;
    background: var(--accent);
    color: #0f1a14;
    border: none;
    padding: 8px 20px;
    border-radius: 20px;
    font-weight: 700;
    letter-spacing: 2px;
    cursor: pointer;
    font-family: inherit;
  }
</style>
</head>
<body>
<div class="wrap">
  <div class="topbar">
    <h1>Snake</h1>
    <button id="shopBtn" title="Skin shop">&#128717;<span class="dot" id="shopDot"></span></button>
  </div>
  <div class="hud">
    <span>SCORE <b id="score">0</b></span>
    <span>BEST <b id="best">0</b></span>
  </div>
  <canvas id="board" width="400" height="400"></canvas>
  <div class="msg" id="msg">Use arrow keys / WASD to move</div>
  <button class="restart" id="restart">PLAY AGAIN</button>
  <div class="controls">
    <button id="up">&#8593;</button>
    <button id="left">&#8592;</button>
    <button id="down">&#8595;</button>
    <button id="right">&#8594;</button>
  </div>
</div>

<div class="overlay open" id="startOverlay">
  <div class="start-panel">
    <h2>SNAKE</h2>
    <p>Arrow keys / WASD to move.<br>Eat food, grow long, unlock skins.</p>
    <button class="start-btn" id="startBtn">START</button>
  </div>
</div>

<div class="overlay" id="overlay">
  <div class="shop">
    <h2>SKIN SHOP</h2>
    <div class="sub">Unlock a new skin every 10 points on your best score</div>
    <div class="skin-grid" id="skinGrid"></div>
    <button class="shop-close" id="shopClose">CLOSE</button>
  </div>
</div>

<script>
const canvas = document.getElementById('board');
const ctx = canvas.getContext('2d');
const cell = 20;
const cols = canvas.width / cell;
const rows = canvas.height / cell;

let snake, dir, nextDir, food, score, best, running, speed, timer;

// ---- persistence helpers ----
function lsGet(key) {
  try { return localStorage.getItem(key); } catch(e) { return null; }
}
function lsSet(key, v) {
  try { localStorage.setItem(key, v); } catch(e) {}
}

// ---- skins ----
const SKINS = [
  { id: 'classic',  name: 'Classic',   req: 0,  pattern: 'solid',   head: '#a3f7c0', base: '#6ee7a0', accent: '#4fc783' },
  { id: 'candy',    name: 'Candy',     req: 10, pattern: 'stripe',  head: '#ffe0ef', base: '#ff8fc4', accent: '#ffffff' },
  { id: 'ocean',    name: 'Bubbles',   req: 20, pattern: 'dot',     head: '#bdf3ff', base: '#3aa8d8', accent: '#eafcff' },
  { id: 'chess',    name: 'Chess',     req: 30, pattern: 'check',   head: '#e8e2ff', base: '#5b4fc7', accent: '#221a4f' },
  { id: 'tiger',    name: 'Tiger',     req: 40, pattern: 'tiger',   head: '#ffdca3', base: '#ff9d3d', accent: '#241505' },
  { id: 'camo',     name: 'Camo',      req: 50, pattern: 'camo',    head: '#c9d9a8', base: '#5c7a3f', accent: '#33461f' },
  { id: 'galaxy',   name: 'Galaxy',    req: 60, pattern: 'galaxy',  head: '#d9c9ff', base: '#2c1e57', accent: '#ffffff' },
  { id: 'zebra',    name: 'Zebra',     req: 70, pattern: 'tiger',   head: '#ffffff', base: '#f2f2f2', accent: '#111111' },
  { id: 'circuit',  name: 'Circuit',   req: 80, pattern: 'circuit', head: '#c9fff5', base: '#0d2b26', accent: '#4dffe0' },
  { id: 'rainbow',  name: 'Rainbow',   req: 90, pattern: 'rainbow', head: '#ffffff', base: '#ffffff', accent: '#ffffff' }
];

best = parseInt(lsGet('snake_best')) || 0;
document.getElementById('best').textContent = best;

let selectedSkinId = lsGet('snake_skin') || 'classic';

function unlockedSkins() {
  return SKINS.filter(s => best >= s.req);
}

function isUnlocked(skin) {
  return best >= skin.req;
}

function currentSkin() {
  const skin = SKINS.find(s => s.id === selectedSkinId);
  return (skin && isUnlocked(skin)) ? skin : SKINS[0];
}

function checkNewUnlocks(prevBest, newBest) {
  const newlyUnlocked = SKINS.filter(s => s.req > prevBest && s.req <= newBest);
  if (newlyUnlocked.length) {
    document.getElementById('shopDot').style.display = 'block';
    document.getElementById('msg').textContent =
      'New skin unlocked: ' + newlyUnlocked[newlyUnlocked.length - 1].name + '! Check the shop.';
    return true;
  }
  return false;
}

// Persists the best score to localStorage the moment it's beaten,
// so it's saved even if the tab/browser closes mid-run (not just on game over).
function updateBest(newScore) {
  if (newScore > best) {
    const prevBest = best;
    best = newScore;
    lsSet('snake_best', best);
    document.getElementById('best').textContent = best;
    return checkNewUnlocks(prevBest, best);
  }
  return false;
}

function renderShop() {
  const grid = document.getElementById('skinGrid');
  grid.innerHTML = '';
  SKINS.forEach(skin => {
    const unlocked = isUnlocked(skin);
    const card = document.createElement('div');
    card.className = 'skin-card' + (unlocked ? '' : ' locked') + (skin.id === selectedSkinId && unlocked ? ' selected' : '');

    const swatch = document.createElement('canvas');
    swatch.width = 68;
    swatch.height = 68;
    swatch.className = 'skin-swatch';
    const sctx = swatch.getContext('2d');
    const tile = 34;
    for (let ty = 0; ty < 2; ty++) {
      for (let tx = 0; tx < 2; tx++) {
        const idx = ty * 2 + tx;
        paintPattern(sctx, tx*tile, ty*tile, tile, tile, 6, skin, idx, false);
      }
    }

    const name = document.createElement('div');
    name.className = 'skin-name';
    name.textContent = skin.name;
    card.appendChild(swatch);
    card.appendChild(name);
    if (!unlocked) {
      const req = document.createElement('div');
      req.className = 'skin-req';
      req.textContent = 'Best score ' + skin.req;
      card.appendChild(req);
    }
    card.onclick = () => {
      if (!unlocked) return;
      selectedSkinId = skin.id;
      lsSet('snake_skin', selectedSkinId);
      renderShop();
    };
    grid.appendChild(card);
  });
}

document.getElementById('shopBtn').onclick = () => {
  document.getElementById('shopDot').style.display = 'none';
  renderShop();
  document.getElementById('overlay').classList.add('open');
};
document.getElementById('shopClose').onclick = () => {
  document.getElementById('overlay').classList.remove('open');
};

function init() {
  snake = [
    {x: 8, y: 10},
    {x: 7, y: 10},
    {x: 6, y: 10}
  ];
  dir = {x: 1, y: 0};
  nextDir = {x: 1, y: 0};
  score = 0;
  speed = 130;
  running = true;
  document.getElementById('score').textContent = score;
  document.getElementById('msg').textContent = 'Use arrow keys / WASD to move';
  document.getElementById('restart').style.display = 'none';
  placeFood();
  if (timer) clearTimeout(timer);
  loop();
}

function placeFood() {
  let valid = false;
  while (!valid) {
    food = { x: Math.floor(Math.random()*cols), y: Math.floor(Math.random()*rows) };
    valid = !snake.some(s => s.x === food.x && s.y === food.y);
  }
}

function loop() {
  if (!running) return;
  update();
  draw();
  timer = setTimeout(loop, speed);
}

function update() {
  dir = nextDir;
  const head = { x: snake[0].x + dir.x, y: snake[0].y + dir.y };

  if (head.x < 0 || head.x >= cols || head.y < 0 || head.y >= rows || snake.some(s => s.x === head.x && s.y === head.y)) {
    gameOver();
    return;
  }

  snake.unshift(head);

  if (head.x === food.x && head.y === food.y) {
    score++;
    document.getElementById('score').textContent = score;
    updateBest(score);
    if (speed > 60) speed -= 3;
    placeFood();
  } else {
    snake.pop();
  }
}

function gameOver() {
  running = false;
  clearTimeout(timer);
  if (score === best && score > 0) {
    document.getElementById('msg').textContent = 'New best! Score: ' + score;
  } else {
    document.getElementById('msg').textContent = 'Game over — Score: ' + score;
  }
  document.getElementById('restart').style.display = 'inline-block';
}

function draw() {
  ctx.fillStyle = getComputedStyle(document.documentElement).getPropertyValue('--board');
  ctx.fillRect(0, 0, canvas.width, canvas.height);

  ctx.strokeStyle = getComputedStyle(document.documentElement).getPropertyValue('--grid');
  ctx.lineWidth = 1;
  for (let i = 0; i <= cols; i++) {
    ctx.beginPath();
    ctx.moveTo(i*cell, 0);
    ctx.lineTo(i*cell, canvas.height);
    ctx.stroke();
  }
  for (let j = 0; j <= rows; j++) {
    ctx.beginPath();
    ctx.moveTo(0, j*cell);
    ctx.lineTo(canvas.width, j*cell);
    ctx.stroke();
  }

  ctx.fillStyle = getComputedStyle(document.documentElement).getPropertyValue('--food');
  roundRect(food.x*cell+2, food.y*cell+2, cell-4, cell-4, 5);
  ctx.fill();

  const skin = currentSkin();
  snake.forEach((s, i) => {
    paintPattern(ctx, s.x*cell+1, s.y*cell+1, cell-2, cell-2, 4, skin, i, i === 0);
  });
}

function roundRect(x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x+r, y);
  ctx.arcTo(x+w, y, x+w, y+h, r);
  ctx.arcTo(x+w, y+h, x, y+h, r);
  ctx.arcTo(x, y+h, x, y, r);
  ctx.arcTo(x, y, x+w, y, r);
  ctx.closePath();
}

function hashCell(a, b) {
  const v = Math.sin(a * 12.9898 + b * 78.233) * 43758.5453;
  return v - Math.floor(v);
}

// Paints one snake segment (or shop swatch tile) with the skin's pattern.
// ctx: canvas 2d context, x/y/w/h: rect, skin: skin object,
// i: index along the snake (or tile index for swatches), isHead: bool
function paintPattern(pctx, x, y, w, h, r, skin, i, isHead) {
  pctx.save();
  pctx.beginPath();
  pctx.moveTo(x+r, y);
  pctx.arcTo(x+w, y, x+w, y+h, r);
  pctx.arcTo(x+w, y+h, x, y+h, r);
  pctx.arcTo(x, y+h, x, y, r);
  pctx.arcTo(x, y, x+w, y, r);
  pctx.closePath();
  pctx.clip();

  // base fill
  if (skin.pattern === 'rainbow') {
    const hue = (i * 32) % 360;
    pctx.fillStyle = isHead ? '#ffffff' : `hsl(${hue}, 85%, 65%)`;
  } else {
    pctx.fillStyle = isHead ? skin.head : skin.base;
  }
  pctx.fillRect(x, y, w, h);

  if (!isHead) {
    pctx.fillStyle = skin.accent;
    switch (skin.pattern) {
      case 'stripe':
        if (i % 2 === 0) pctx.fillRect(x, y, w * 0.42, h);
        break;
      case 'dot':
        if (i % 2 === 0) {
          pctx.beginPath();
          pctx.arc(x + w/2, y + h/2, w * 0.24, 0, Math.PI*2);
          pctx.fill();
        }
        break;
      case 'check':
        if (i % 2 === 0) pctx.fillRect(x, y, w, h);
        break;
      case 'tiger':
        pctx.save();
        pctx.translate(x + w/2, y + h/2);
        pctx.rotate(Math.PI / 4);
        if (i % 2 === 0) pctx.fillRect(-w/2, -h*0.16, w, h*0.32);
        pctx.restore();
        break;
      case 'camo': {
        const h1 = hashCell(i, 1.7);
        const h2 = hashCell(i, 5.3);
        if (h1 > 0.4) {
          pctx.beginPath();
          pctx.ellipse(x + w*0.35, y + h*0.4, w*0.32, h*0.22, h1*3, 0, Math.PI*2);
          pctx.fill();
        }
        if (h2 > 0.55) {
          pctx.beginPath();
          pctx.ellipse(x + w*0.65, y + h*0.65, w*0.26, h*0.2, h2*2, 0, Math.PI*2);
          pctx.fill();
        }
        break;
      }
      case 'galaxy': {
        for (let k = 0; k < 3; k++) {
          const hx = hashCell(i + k*3.1, 2.2);
          const hy = hashCell(i + k*1.7, 9.9);
          pctx.beginPath();
          pctx.arc(x + hx*w, y + hy*h, 1.1, 0, Math.PI*2);
          pctx.fill();
        }
        break;
      }
      case 'circuit':
        pctx.strokeStyle = skin.accent;
        pctx.lineWidth = Math.max(1, w * 0.08);
        pctx.beginPath();
        if (i % 2 === 0) {
          pctx.moveTo(x + w/2, y);
          pctx.lineTo(x + w/2, y + h);
        } else {
          pctx.moveTo(x, y + h/2);
          pctx.lineTo(x + w, y + h/2);
        }
        pctx.stroke();
        pctx.beginPath();
        pctx.arc(x + w/2, y + h/2, w*0.09, 0, Math.PI*2);
        pctx.fill();
        break;
      default:
        break; // 'solid' — no overlay
    }
  }
  pctx.restore();
}

function setDir(x, y) {
  if (dir.x === -x && dir.y === -y) return; // no reverse
  nextDir = {x, y};
}

document.addEventListener('keydown', e => {
  switch (e.key) {
    case 'ArrowUp': case 'w': case 'W': setDir(0, -1); break;
    case 'ArrowDown': case 's': case 'S': setDir(0, 1); break;
    case 'ArrowLeft': case 'a': case 'A': setDir(-1, 0); break;
    case 'ArrowRight': case 'd': case 'D': setDir(1, 0); break;
  }
});

document.getElementById('up').onclick = () => setDir(0, -1);
document.getElementById('down').onclick = () => setDir(0, 1);
document.getElementById('left').onclick = () => setDir(-1, 0);
document.getElementById('right').onclick = () => setDir(1, 0);
document.getElementById('restart').onclick = init;

// swipe support
let touchStartX, touchStartY;
canvas.addEventListener('touchstart', e => {
  touchStartX = e.touches[0].clientX;
  touchStartY = e.touches[0].clientY;
}, {passive: true});
canvas.addEventListener('touchend', e => {
  const dx = e.changedTouches[0].clientX - touchStartX;
  const dy = e.changedTouches[0].clientY - touchStartY;
  if (Math.abs(dx) > Math.abs(dy)) {
    setDir(dx > 0 ? 1 : -1, 0);
  } else {
    setDir(0, dy > 0 ? 1 : -1);
  }
}, {passive: true});

document.getElementById('startBtn').onclick = () => {
  document.getElementById('startOverlay').classList.remove('open');
  init();
};

// idle preview before first start
(function drawIdle() {
  snake = [{x: 8, y: 10}, {x: 7, y: 10}, {x: 6, y: 10}];
  food = { x: 14, y: 10 };
  const skin = currentSkin();
  ctx.fillStyle = getComputedStyle(document.documentElement).getPropertyValue('--board');
  ctx.fillRect(0, 0, canvas.width, canvas.height);
  ctx.strokeStyle = getComputedStyle(document.documentElement).getPropertyValue('--grid');
  ctx.lineWidth = 1;
  for (let i = 0; i <= cols; i++) {
    ctx.beginPath(); ctx.moveTo(i*cell, 0); ctx.lineTo(i*cell, canvas.height); ctx.stroke();
  }
  for (let j = 0; j <= rows; j++) {
    ctx.beginPath(); ctx.moveTo(0, j*cell); ctx.lineTo(canvas.width, j*cell); ctx.stroke();
  }
  ctx.fillStyle = getComputedStyle(document.documentElement).getPropertyValue('--food');
  roundRect(food.x*cell+2, food.y*cell+2, cell-4, cell-4, 5);
  ctx.fill();
  snake.forEach((s, i) => paintPattern(ctx, s.x*cell+1, s.y*cell+1, cell-2, cell-2, 4, skin, i, i === 0));
})();
</script>
</body>
</html>
